name: CI & Quality — Infra & Orquestrador

on:
  push:
    branches:
      - master
      - main
      - desenv
  pull_request:
    branches:
      - master
      - main
      - desenv

jobs:
  sonar:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
